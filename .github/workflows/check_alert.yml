name: Check ETF alerts

on:
  schedule:
    # Una volta al giorno, lun-ven, alle 17:00 UTC (dopo la chiusura di
    # Borsa Italiana/Xetra, che chiudono verso le 17:30-17:35 CET/CEST).
    # NB: essendo UTC fisso, con il cambio ora legale l'orario locale
    # effettivo si sposta di un'ora tra inverno ed estate (18:00 CET
    # d'inverno, 19:00 CEST d'estate) — comunque sempre a mercato chiuso.
    - cron: "0 17 * * 1-5"
  workflow_dispatch: {}  # permette di lanciarlo manualmente da GitHub

permissions:
  contents: write  # serve per ricommittare state.json

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run alert check
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TICKERS: "MWRD.MI,EMAE.MI"
          DROP_THRESHOLD: "0.05"
        run: python alert_etf.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Aggiorna state.json [skip ci]"
          git push
