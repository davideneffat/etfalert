name: Check MWRD alert

on:
  schedule:
    # Ogni 30 minuti, dal lunedì al venerdì, dalle 8:00 alle 18:00 UTC
    # (copre l'orario di Borsa Italiana/Xetra in orario CET/CEST)
    - cron: "*/30 8-18 * * 1-5"
  workflow_dispatch: {}  # permette di lanciarlo manualmente da GitHub

permissions:
  contents: write  # serve per ricommittare state.json

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run alert check
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TICKER: "MWRD.MI"
          DROP_THRESHOLD: "0.05"
        run: python alert_mwrd.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Aggiorna state.json [skip ci]"
          git push
